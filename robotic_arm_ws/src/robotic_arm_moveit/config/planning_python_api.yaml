planning_pipelines:
  pipeline_names: ["ompl"]

plan_request_params:
  planner_id: ompl
  planning_attempts: 1
  planning_pipeline: ompl
  # Real servos are capped at ~0.46 rad/s by the ESP32 firmware (ARM_SERVO_MOVE_SPEED = 300 steps/s):
  # 0.1 x 4.24 rad/s (joint_limits.yaml) = 0.42 rad/s, so the arm can follow the planned timing.
  max_velocity_scaling_factor: 0.1
  max_acceleration_scaling_factor: 0.1
